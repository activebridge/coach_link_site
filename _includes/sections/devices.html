<section class="devices"><div class="wrap"><h2 data-reveal>{{ t.watches_h | escape }}</h2><div class="dev-row">{% for d in t.devices %}<div class="dev{% if d.on %} on{% endif %}" data-reveal><span class="dev-n">{{ d.name | escape }}</span><span class="dev-s">{% if d.on %}<i></i>{{ t.live | escape }}{% else %}{{ t.soon | escape }}{% endif %}</span></div>{% endfor %}</div></div></section>
