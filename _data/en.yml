faq_h: FAQ
faq:
- q: Which watches are supported?
  a: Garmin works in the beta. Apple Watch and Amazfit are next, Wear OS after that.
- q: Does my client need to pay?
  a: No. The app is free for clients, always.
- q: Does it drain the battery?
  a: Coach Link only sends data during a session you have started together, so a normal workout is not affected noticeably. We will publish real numbers from the beta.
- q: How many clients can I track at once?
  a: Up to 5 on PRO, unlimited on PRO MAX.
- q: Is client data private?
  a: Clients choose what to share and can stop anytime. See our privacy policy.
- q: When does the beta start?
  a: The beta starts on December 1. We review applications and reply within 7 days, so apply now to get a founding-coach spot.
