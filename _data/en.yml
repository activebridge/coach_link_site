priv:
- h: What we collect
  p: 'The details you enter in the beta application or launch-event form: name, email, social handle, location, coaching type, number of clients and watch types. We also record which channel you came from (UTM tags) and a referral code if you used one.'
- h: Why
  p: To review beta applications, contact you about the beta and the launch event, and decide which watches to support first.
- h: Who sees it
  p: Only the Coach Link team and the services we use to store the data and send email. We do not sell your data.
- h: Your rights
  p: Write to [email] to see, correct or delete your data, or to withdraw consent at any time.
- h: Health data
  p: This site does not collect health data. The Coach Link app only shares what a client chooses to share with their coach.
