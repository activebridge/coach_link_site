faq:
- q: Які годинники підтримуються?
  a: У бета-версії працює Garmin. Apple Watch і Amazfit — наступні, Wear OS — після них.
- q: Чи має клієнт платити?
  a: Ні. Для клієнтів застосунок безкоштовний, завжди.
- q: Чи розряджає батарею?
  a: Coach Link передає дані лише під час тренування, яке ви почали разом, тож звичайне заняття помітно не страждає. Реальні цифри опублікуємо після бети.
- q: Скількох клієнтів можна вести одночасно?
  a: До 5 на PRO, без обмежень на PRO MAX.
- q: Чи приватні дані клієнта?
  a: Клієнт сам обирає, чим ділитись, і може зупинити будь-коли. Див. політику конфіденційності.
- q: Коли стартує бета?
  a: Бета стартує 1 грудня. Ми переглядаємо заявки й відповідаємо протягом 7 днів, тож подайте заявку, щоб отримати місце тренера-засновника.
