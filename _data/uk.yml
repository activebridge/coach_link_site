    title: Політика конфіденційності
    desc: Як wrist.coach збирає, використовує й захищає інформацію, якою ви ділитесь на цьому сайті та в застосунку.
    updated: 11 листопада 2026
    intro: Ця політика пояснює, які персональні дані wrist.coach збирає на сайті та в застосунку, навіщо і які вибори у вас є. Ми навмисно пишемо коротко й просто.
    sections:
    - h: Хто ми
      p:
      - 'wrist.coach («ми») дозволяє персональному тренеру бачити пульс клієнта й супутні дані з годинника наживо на телефоні тренера. Ми вирішуємо, як використовуються дані, описані нижче. Контакт: [email].'
    - h: Що ми збираємо
      p:
      - 'Залежно від того, як ви користуєтесь wrist.coach, ми збираємо:'
      ul:
      - 'Заявка на бету: ім’я, email, акаунт в Instagram чи TikTok, країну й місто, як ви тренуєте, кількість активних клієнтів і годинники, якими користуються ваші клієнти.'
      - 'Дані кампанії: мову сторінки та, якщо в посиланні, за яким ви прийшли, вони є, UTM-мітки й реферальний код. Вони зберігаються в сесійному сховищі браузера, поки відкрита вкладка, і надсилаються разом із заявкою.'
      - 'У застосунку (під час бети й після): дані акаунта тренера, клієнтів, з якими тренер з’єднався, і дані, якими годинник клієнта ділиться під час сесії: пульс, зони пульсу, кроки та, де годинник їх надає, стрес, дихання, Body Battery та подібні показники, а також історію тренувань і нотатки тренера.'
    - h: Навіщо ми це використовуємо
      p:
      - Ми використовуємо персональні дані, щоб розглядати заявки на бету й зв’язуватись із вами щодо неї (ваша згода та дії, яких ви просите до початку користування сервісом); надавати сервіс, якого просите ви чи ваш тренер (виконання договору); розуміти, які канали й годинники важливі, та підтримувати безпеку сервісу (наш законний інтерес у роботі й вдосконаленні сервісу). Де ми спираємось на згоду, ви можете відкликати її будь-коли.
    - h: Клієнти та їхні дані
      p:
      - З’єднання з тренером підтверджується на годиннику самого клієнта. Клієнт сам обирає, чим ділитись, і може зупинити передачу будь-коли. Тренер може з’єднуватись лише з клієнтами, які погодились.
      - wrist.coach призначений для тренувань і добробуту. Це не медичний пристрій, він не діагностує й не відстежує медичних станів.
    - h: Хто бачить ваші дані
      p:
      - 'Лише команда wrist.coach і постачальники, які допомагають нам запускати сайт і застосунок: хостинг сайту та доставка контенту (GitHub Pages і Cloudflare), сервери й бази даних для застосунку та форми заявки, а також надсилання email. Вони можуть обробляти дані лише за нашими інструкціями.'
      - Ми не продаємо персональні дані й не використовуємо їх для реклами.
    - h: Передача даних за кордон
      p:
      - Частина наших постачальників розташована поза вашою країною, зокрема поза ЄС, ЄЕЗ та Україною. Де цього вимагає закон, ми спираємось на належні гарантії для такої передачі.
    - h: Як довго ми зберігаємо дані
      p:
      - Дані заявки ми зберігаємо лише доти, доки вони потрібні для бети й зв’язку з вами, а потім видаляємо або знеособлюємо. Дані акаунта й сесій зберігаються, поки акаунт активний, і ви можете попросити видалити їх раніше. Мінімальні записи ми можемо зберігати, якщо цього вимагає закон.
    - h: Cookies і сховище браузера
      p:
      - Цей сайт не використовує рекламних чи аналітичних cookies. Мітки кампанії зберігаються в сесійному сховищі, яке очищується, коли ви закриваєте вкладку. Наш постачальник хостингу й безпеки може встановлювати технічні cookies або обробляти запити, потрібні для доставки й захисту сайту.
    - h: Ваші права
      p:
      - Залежно від того, де ви живете (наприклад, за GDPR), ви можете попросити доступ до своїх даних, виправлення, видалення чи передачу в зручному форматі, обмежити або заперечити проти певних видів використання та відкликати згоду. Напишіть на [email], і ми відповімо якнайшвидше.
      - Ви також маєте право поскаржитись до свого органу із захисту даних.
    - h: Діти
      p:
      - Сайт і форма заявки призначені для дорослих. Тренер не повинен з’єднуватись із неповнолітнім без згоди його батьків чи опікуна.
    - h: Зміни
      p:
      - Коли щось змінюється, ми оновлюємо цю сторінку й дату вище. Про суттєві зміни ми повідомимо заявників на бету електронною поштою.
    - h: Контакт
      p:
      - 'Питання щодо ваших даних: [email].'
  terms:
    title: Умови користування
    desc: 'Правила користування сайтом wrist.coach, бета-програмою та застосунком: акаунти, згода клієнтів, ціни та відповідальність.'
    updated: 11 листопада 2026
    intro: Ці умови стосуються сайту wrist.coach, бета-програми та застосунків wrist.coach (разом — «Сервіс»). Подаючи заявку на бету, створюючи акаунт чи користуючись Сервісом, ви погоджуєтесь із ними та з нашою Політикою конфіденційності. Якщо ви не погоджуєтесь, будь ласка, не користуйтесь Сервісом.
    sections:
    - h: Бета-програма
      p:
      - 'Бета — за запрошенням: ми розглядаємо заявки вручну, і подання заявки не гарантує місця. Ми прагнемо відповісти на кожну заявку протягом 7 днів. Функції бети можуть змінюватись, ламатись або зникати.'
      - Лише бета-тренери (тренери-засновники) отримують перший рік PRO безкоштовно. Умови частки від промокоду будуть погоджені письмово до будь-яких виплат. Ми можемо припинити участь у беті, якщо ці умови порушено.
    - h: Акаунти й тренери
      p:
      - Тренери мають бути повнолітніми, надавати правдиву інформацію й берегти свої дані для входу. Ви відповідаєте за все, що відбувається у вашому акаунті.
    - h: Клієнти та згода
      p:
      - Тренер має отримати чітку згоду клієнта до з’єднання з його годинником. Клієнти підтверджують з’єднання на власному годиннику, самі обирають, чим ділитись, і можуть зупинити будь-коли.
      - Тренер може використовувати дані клієнта лише для тренувань цього клієнта й не повинен ділитись ними з іншими без дозволу клієнта.
    - h: Це не медична порада
      p:
      - wrist.coach показує інформацію про навантаження, відновлення та готовність, отриману зі споживчих годинників. Це не медичний пристрій, він не діагностує, не лікує й не запобігає жодним станам, а показники можуть бути неточними чи запізнюватись.
      - Тренери й клієнти самі відповідають за свої рішення щодо тренувань. Зупиніться й зверніться по медичну допомогу, якщо комусь стало зле.
    - h: Годинники й треті сторони
      p:
      - wrist.coach працює з годинниками й платформами інших компаній, як-от Garmin, Apple, Amazfit і Google. Ми не пов’язані з ними, а їхні назви є торговельними марками їхніх власників. Їхня доступність, умови й точність їхніх даних поза нашим контролем.
    - h: Ціни
      p:
      - 'Застосунок безкоштовний для клієнтів. Тарифи тренера: Free (1 клієнт одночасно, лише перегляд наживо, без історії тренувань), PRO — $5 на місяць (до 5 клієнтів одночасно) і PRO MAX — $15 на місяць (без обмежень за кількістю клієнтів). Перший рік PRO безкоштовний лише для бета-тренерів; усі інші платять за цінами вище.'
      - Ми повідомимо вас до того, як щось списати чи змінити ціну, а умови оплати буде показано до платежу.
    - h: Допустиме використання
      p:
      - 'Будь ласка, не робіть такого:'
      ul:
      - не використовуйте Сервіс для протиправних цілей чи для стеження за людиною, яка на це не погодилась;
      - не з’єднуйтесь із годинником клієнта без його згоди;
      - не розбирайте код, не порушуйте й не перевантажуйте роботу Сервісу та не намагайтесь отримати доступ до чужих акаунтів;
      - не збирайте дані із Сервісу автоматично й не створюйте на його основі конкуруючий продукт.
    - h: Доступність
      p:
      - Під час бети Сервіс надається «як є». Ми не обіцяємо, що він працюватиме безперервно чи без помилок.
    - h: Відповідальність
      p:
      - Наскільки це дозволяє закон, ми не відповідаємо за непрямі чи похідні збитки, втрату даних або травми, спричинені рішеннями щодо тренувань, ухваленими з допомогою Сервісу. Ніщо в цих умовах не обмежує відповідальності, яку не можна обмежити законом, зокрема за шахрайство чи смерть або шкоду здоров’ю через недбалість.
    - h: Інтелектуальна власність
      p:
      - Назва wrist.coach, логотип, сайт і програмне забезпечення належать нам. Ви зберігаєте право власності на свої дані й даєте нам лише той дозвіл, який потрібен, щоб надавати вам Сервіс.
    - h: Призупинення й припинення
      p:
      - Ви можете припинити користуватись Сервісом і попросити видалити акаунт будь-коли. Ми можемо призупинити або припинити доступ, якщо ці умови порушено чи цього вимагає закон, і пояснимо причину, де це можливо.
    - h: Зміни
      p:
      - Ми можемо оновлювати ці умови; дата вище показує останню версію. Про суттєві зміни ми напишемо вам електронною поштою до того, як вони набудуть чинності. Якщо ви продовжуєте користуватись Сервісом, ви приймаєте нові умови.
    - h: Застосовне право
      p:
      - Ці умови регулюються законами України, без обмеження обов’язкових прав споживачів за місцем вашого проживання.
    - h: Контакт
      p:
      - 'Питання щодо цих умов: [email].'
